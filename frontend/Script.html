// [CONFIG] GAS call timeout in ms — prevents UI hanging indefinitely

// [UTIL] Format number to Rupiah display string
var _rpFmt = new Intl.NumberFormat('id-ID');
function fRp(v) { return 'Rp\u00a0' + _rpFmt.format(+v || 0); }

// [CONFIG] Active timezone from browser — used for date formatting and overdue checks
var _TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;

// [UTIL] Format date/datetime to local display string (dd Mon yyyy)
var _dtFmt = new Intl.DateTimeFormat('id-ID', {
  day: '2-digit', month: 'short', year: 'numeric',
  timeZone: _TZ
});
function fDt(d) {
  if (!d) return '—';
  var dt = (d instanceof Date) ? d : new Date(d);
  return isNaN(dt.getTime()) ? String(d) : _dtFmt.format(dt);
}

// [PERF] Module-level singleton — avoids creating new Intl object on every _todayLocal() call
var _todayFmt = new Intl.DateTimeFormat('en-CA', {
  year: 'numeric', month: '2-digit', day: '2-digit', timeZone: _TZ
});

// [UTIL] Return today as yyyy-MM-dd in browser local timezone
function _todayLocal() {
  var parts = _todayFmt.formatToParts(new Date()), p = {};
  parts.forEach(function(x) { p[x.type] = x.value; });
  return p.year + '-' + p.month + '-' + p.day;
}
// [UTIL] Check if due_date is overdue — re-evaluates today on each call, safe across midnight
function isOD(due) { return due ? due < _todayLocal() : false; }

// [UTIL] Calculate payment percentage capped at 100
function pct(p, t) { t = +t; p = +p; return t ? Math.min(100, Math.round(p / t * 100)) : 0; }

// [UTIL] Escape HTML special characters — prevents XSS in innerHTML concatenation
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// [UTIL] Extract initials from full name
function ini(n) {
  var a = String(n || '').trim().split(/\s+/);
  return a.length >= 2 ? (a[0][0] + a[1][0]).toUpperCase() : String(n || '').slice(0, 2).toUpperCase();
}

function g(id) { return document.getElementById(id); }

// [UTIL] Parse raw input to safe non-negative integer
function _rpInt(v) {
  var n = parseInt(String(v || 0).replace(/\D/g, ''), 10);
  return isNaN(n) ? 0 : Math.max(0, n);
}

// [UX] Init currency input with live Rupiah formatting
function initCI(el, cb) {
  el.addEventListener('input', function() {
    var pos = el.selectionStart, old = el.value;
    var rn  = _rpInt(old);
    var db  = old.slice(0, pos).replace(/\D/g, '').length;
    var fmt = rn ? _rpFmt.format(rn) : '';
    el.value = fmt; el.dataset.raw = String(rn);
    var nc = 0, dc = 0;
    for (var i = 0; i < fmt.length; i++) {
      if (/\d/.test(fmt[i])) { dc++; if (dc === db) { nc = i + 1; break; } }
    }
    if (!db) nc = 0; else if (dc < db) nc = fmt.length;
    el.setSelectionRange(nc, nc);
    if (cb) cb(); else updatePrev();
  });
  el.addEventListener('keydown', function(e) {
    if (e.key === '.' || e.key === ',') e.preventDefault();
  });
}

// [UTIL] Read formatted currency input as raw integer
function raw(id) { return _rpInt(g(id).dataset.raw); }
// [UTIL] Reset currency input to empty
function resetCI(id) { var e = g(id); e.value = ''; e.dataset.raw = '0'; }
// [UTIL] Set currency input value programmatically
function setCI(id, val) {
  var e = g(id), n = _rpInt(val);
  e.value = n ? _rpFmt.format(n) : '';
  e.dataset.raw = String(n);
}

// [UTIL] call() — wraps google.script.run with timeout; fails gracefully after CALL_TIMEOUT_MS
function call(p, ok, fail) {
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    var done = false;
    var timer = setTimeout(function() {
      if (done) return;
      done = true;
      if (fail) fail('Request timeout — server tidak merespons. Coba lagi.');
    }, CALL_TIMEOUT_MS);
    google.script.run
      .withSuccessHandler(function(r) {
        if (done) return;
        done = true; clearTimeout(timer);
        try {
          var d = typeof r === 'string' ? JSON.parse(r) : r;
          d.success ? ok(d) : (fail && fail(d.message || 'Error'));
        } catch(e) { if (fail) fail('Parse error: ' + e.message); }
      })
      .withFailureHandler(function(e) {
        if (done) return;
        done = true; clearTimeout(timer);
        if (fail) fail(e.message || 'Server error');
      })
      .processRequest(JSON.stringify(p));
  } else {
    demo(p, ok, fail);
  }
}

// [SECURITY] Client sanitize name field

  return String(v || '').replace(/<[^>]*>/g, '').replace(/[<>"'`]/g, '').trim().slice(0, 200);

// [SECURITY] Client sanitize notes field
function _sNotes(v) {
  return String(v || '')
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<[^>]*>/g, '')
    .replace(/javascript:/gi, '')
    .replace(/on\w+\s*=/gi, '')
    .trim().slice(0, 1000);
}

// [CALC] Build dashboard summary totals from debt list
function buildSummary(allDebts) {
  var all    = allDebts || [];
  var active = all.filter(function(d){ return !d.archived; });
  var archivedCount = all.filter(function(d){ return !!d.archived; }).length;
  var lunasTotal = active.filter(function(d){ return d.status === 'paid'; }).length;
  var s = {totalHutang:0, totalPaid:0, totalSisa:0, totalOverpayment:0, aktif:0, lunas:lunasTotal, total:0, archived:archivedCount};
  for (var i = 0; i < active.length; i++) {
    s.totalHutang      += +active[i].total_amount        || 0;
    s.totalPaid        += +active[i].paid_amount         || 0;
    s.totalSisa        += +active[i].remaining_amount    || 0;
    s.totalOverpayment += +active[i].overpayment_amount  || 0;
    if (active[i].status !== 'paid') s.aktif++;
  }
  s.total = s.aktif + s.lunas;
  return s;
}

// [API] Demo mode — simulate all backend actions in-memory
function demo(p, ok, fail) {
  setTimeout(function() {
    try {
      var action = p.action;
      if (action === 'getDebts') {
        if (p.id) {
          var d = DD.find(function(x) { return x.id === p.id; });
          var i = DI.filter(function(x) { return x.debt_id === p.id; });
          d ? ok({ success:true, data:JSON.parse(JSON.stringify(d)), installments:i })
            : (fail && fail('Tidak ditemukan'));
        } else {
          var page  = +p.page  || 1;
          var limit = +p.limit || 100;
          var q     = (p.q || '').toLowerCase();
          var onlyArch = p.onlyArchived === true || p.onlyArchived === 'true';
          var inclArch = p.includeArchived === true || p.includeArchived === 'true';
          var base = DD.filter(function(d){
            if(onlyArch) return !!d.archived;
            if(inclArch) return true;
            return !d.archived;
          });
          var list = q ? base.filter(function(d) {
            return (d.person_name||'').toLowerCase().indexOf(q) !== -1 ||
                   (d.notes||'').toLowerCase().indexOf(q)       !== -1 ||
                   (d.status||'').indexOf(q)                    !== -1;
          }) : base.slice();
          list = list.slice().reverse();
          var total = list.length;
          var slice = list.slice((page-1)*limit, page*limit);

          ok({ success:true, data:JSON.parse(JSON.stringify(slice)),
               total:total, page:page, limit:limit,
               summary:buildSummary(DD) });
        }
      }
      else if (action === 'createDebt') {
        var nm  = _sName(p.person_name);
        var pr  = _rpInt(p.principal_amount);
        var ir  = _rpInt(p.interest_amount);
        var nts = _sNotes(p.notes);
        if (!nm)   { fail && fail('Nama tidak boleh kosong');   return; }
        if (pr<=0) { fail && fail('Pokok harus lebih dari 0'); return; }
        var tot = pr + ir;
        var now = new Date().toISOString();
        var nd  = {
          id: _demoDebtId(),
          person_name:nm, principal_amount:pr, interest_amount:ir,
          total_amount:tot, paid_amount:0, remaining_amount:tot, overpayment_amount:0,
          status:'active', due_date:p.due_date||'', notes:nts,
          created_at:now, updated_at:now
        };
        DD.unshift(nd);
        ok({ success:true, data:JSON.parse(JSON.stringify(nd)) });
      }
      else if (action === 'updateDebt') {
        var idx = DD.findIndex(function(x) { return x.id === p.id; });
        if (idx < 0) { fail && fail('Tidak ditemukan'); return; }
        var ud  = DD[idx];
        var unm = p.person_name      !== undefined ? _sName(p.person_name)    : ud.person_name;
        var upr = p.principal_amount !== undefined ? _rpInt(p.principal_amount): ud.principal_amount;
        var uir = p.interest_amount  !== undefined ? _rpInt(p.interest_amount) : ud.interest_amount;
        var unt = p.notes            !== undefined ? _sNotes(p.notes)          : ud.notes;
        if (!unm)   { fail && fail('Nama tidak boleh kosong');   return; }
        if (upr<=0) { fail && fail('Pokok harus lebih dari 0'); return; }
        var utot  = upr + uir;
        var upaid = Math.max(0, _rpInt(ud.paid_amount));
        var urem  = Math.max(0, utot - upaid);
        var uov2  = upaid > utot ? upaid - utot : 0;
        ud.person_name        = unm;   ud.principal_amount   = upr;
        ud.interest_amount    = uir;   ud.total_amount       = utot;
        ud.paid_amount        = upaid; ud.remaining_amount   = urem;
        ud.overpayment_amount = uov2;
        ud.status             = urem <= 0 ? 'paid' : 'active';
        ud.due_date           = p.due_date !== undefined ? p.due_date : ud.due_date;
        ud.notes              = unt;
        ud.updated_at         = new Date().toISOString();
        ok({ success:true, data:JSON.parse(JSON.stringify(ud)) });
      }
      else if (action === 'deleteDebt') {
        var didx = DD.findIndex(function(x) { return x.id === p.id; });
        if (didx < 0) { fail && fail('Tidak ditemukan'); return; }
        DD.splice(didx, 1);
        for (var j = DI.length - 1; j >= 0; j--) { if (DI[j].debt_id === p.id) DI.splice(j, 1); }
        ok({ success:true, deleted_id:p.id });
      }
      else if (action === 'addPayment') {
        var debt = DD.find(function(x) { return x.id === p.debt_id; });
        if (!debt) { fail && fail('Debt tidak ditemukan'); return; }
        var pay  = _rpInt(p.payment_amount);
        if (pay <= 0) { fail && fail('Jumlah harus lebih dari 0'); return; }
        var newPaid = Math.max(0, _rpInt(debt.paid_amount)) + pay;
        debt.paid_amount        = newPaid;
        debt.remaining_amount   = Math.max(0, debt.total_amount - newPaid);
        debt.overpayment_amount = newPaid > debt.total_amount ? newPaid - debt.total_amount : 0;
        debt.status             = debt.remaining_amount <= 0 ? 'paid' : 'active';
        debt.updated_at         = new Date().toISOString();
        var pdate = p.payment_date || new Date().toISOString().slice(0,10);
        var now2  = new Date().toISOString();
        DI.push({ id:_demoInstId(), debt_id:p.debt_id,
                  payment_amount:pay, payment_date:pdate, created_at:now2 });
        ok({ success:true, data:JSON.parse(JSON.stringify(debt)) });
      }
      else if (action === 'archiveDebt') {
        var aidx = DD.findIndex(function(x) { return x.id === p.id; });
        if (aidx < 0) { fail && fail('Tidak ditemukan'); return; }
        if (DD[aidx].status !== 'paid') { fail && fail('Hanya transaksi lunas yang bisa di-archive'); return; }
        DD[aidx].archived = true; DD[aidx].updated_at = new Date().toISOString();
        ok({ success:true, data:JSON.parse(JSON.stringify(DD[aidx])) });
      }
      else if (action === 'unarchiveDebt') {
        var uidx = DD.findIndex(function(x) { return x.id === p.id; });
        if (uidx < 0) { fail && fail('Tidak ditemukan'); return; }
        DD[uidx].archived = false; DD[uidx].updated_at = new Date().toISOString();
        ok({ success:true, data:JSON.parse(JSON.stringify(DD[uidx])) });
      }
      else if (action === 'healthCheck') {
        ok({ success:true, status:'healthy (demo)', spreadsheet:'Demo Mode',
             debts:DD.length, payments:DI.length,
             tz:'Asia/Jakarta', now: new Date().toISOString() });
      }
      else { fail && fail('Unknown action: ' + action); }
    } catch(e) { fail && fail(e.message || 'Demo error'); }
  }, 450 + Math.random() * 200);
}

// [UTIL] Animated scroll to top — rAF ease-out cubic, targets #app for GAS iframe compatibility
function _scrollTop(el, onDone) {
  var container = el || document.getElementById('app') || document.body;
  var start = container.scrollTop;
  if (start === 0) { if (onDone) onDone(); return; }
  var dur = Math.min(320, Math.max(120, start * 0.4));
  var t0 = null;
  function ease(t) { return 1 - Math.pow(1 - t, 3); }
  function step(ts) {
    if (!t0) t0 = ts;
    var prog = Math.min((ts - t0) / dur, 1);
    container.scrollTop = start * (1 - ease(prog));
    if (prog < 1) { requestAnimationFrame(step); }
    else { container.scrollTop = 0; if (onDone) onDone(); }
  }
  requestAnimationFrame(step);
}

// [UI] Navigate to named SPA page with slide transition
function goPage(name) {
  if (S.busy || name === S.page) return;
  S.busy = true;
  S.prevPage = S.page;
  if (S.page === 'transactions') closeAllSwipes();
  var out = g('page-' + S.page), inn = g('page-' + name);

  inn.style.display = 'block'; inn.classList.add('p-enter');

  var navItems = document.querySelectorAll('.nav-item');
  for (var i = 0; i < navItems.length; i++) navItems[i].classList.remove('active');
  g('nav-' + name).classList.add('active');
  D.fab.classList.toggle('hidden', name !== 'dashboard');

}

// [UX] Init pull-to-refresh touch gesture
function initPullToRefresh() {
  var sy = 0, pull = false, th = 70, max = 100, refreshing = false;
  var ptr = D.ptr, txt = D.prtxt;
  document.addEventListener('touchstart', function(e) {
    var appEl = document.getElementById('app');
    if ((appEl ? appEl.scrollTop : window.scrollY) === 0) { sy = e.touches[0].clientY; pull = true; }
  }, { passive: true });
  document.addEventListener('touchmove', function(e) {
    if (!pull || refreshing) return;
    var dy = Math.min(max, e.touches[0].clientY - sy);
    if (dy <= 0) { pull = false; return; }
    var h = Math.max(0, (dy / max) * 52);
    ptr.style.height = h + 'px';
    ptr.style.paddingTop = ptr.style.paddingBottom = h > 10 ? '8px' : '0';
    ptr.classList.toggle('ready', dy >= th);
    txt.textContent = dy >= th ? 'Lepas untuk refresh' : 'Tarik untuk refresh';
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    if (!pull) return;
    var dy = e.changedTouches[0].clientY - sy; pull = false;
    if (dy >= th && !refreshing) {
      refreshing = true; txt.textContent = 'Memperbarui…';
      refreshData(function() {
        ptr.style.height = ptr.style.paddingTop = ptr.style.paddingBottom = '0';
        ptr.classList.remove('ready'); txt.textContent = 'Tarik untuk refresh';
        refreshing = false;
      });
    } else {
      ptr.style.height = ptr.style.paddingTop = ptr.style.paddingBottom = '0';
      ptr.classList.remove('ready');
    }
  }, { passive: true });
}

// [PERF] rAF handle registry — cancel any running countUp animation before starting a new one
var _rafHandles = {};

// [UI] Animate number count-up with rAF cubic-ease; cancels stale animation on same element
function countUp(id, target, fmt) {
  var el = g(id); if (!el) return;
  if (_rafHandles[id]) { cancelAnimationFrame(_rafHandles[id]); _rafHandles[id] = null; }
  var dur = 400, st = null;
  function tick(ts) {
    if (!st) st = ts;
    var e = Math.min(ts - st, dur), ease = 1 - Math.pow(1 - e / dur, 3);
    el.textContent = fmt ? fmt(Math.round(target * ease)) : Math.round(target * ease);
    if (e < dur) {
      _rafHandles[id] = requestAnimationFrame(tick);
    } else {
      el.textContent = fmt ? fmt(target) : target;
      _rafHandles[id] = null;
    }
  }
  _rafHandles[id] = requestAnimationFrame(tick);
}

// [STATE] Track currently open swipe wrap ID
var _openSwipe = null;

// [UX] Close all open swipe cards by snapping them back to center
function closeAllSwipes() {
  if (!_openSwipe) return;
  var wrap = g('sw-' + _openSwipe);
  if (wrap) {
    var card = wrap.querySelector('.tx-card');
    if (card) {
      card.classList.add('settling');
      card.style.transform = 'translateX(0)';
      setTimeout(function() { card.classList.remove('settling'); }, 260);
    }
    wrap.classList.remove('revealed');
  }
  _openSwipe = null;
}

// [PERF] WeakMap tracks swipe listeners per card element — stale listeners removed on each re-render
var _swipeListeners = typeof WeakMap !== 'undefined' ? new WeakMap() : null;

// [UX] Attach touch-based swipe gesture — left reveals Arsip/Hapus, right reveals Edit/Restore
function initSwipeGesture(id) {
  var wrap = g('sw-' + id);
  if (!wrap) return;
  var card = wrap.querySelector('.tx-card');
  if (!card) return;

  if (_swipeListeners) {
    var prev = _swipeListeners.get(card);
    if (prev) {
      card.removeEventListener('touchstart',  prev.start,  { passive: true });
      card.removeEventListener('touchmove',   prev.move,   { passive: false });
      card.removeEventListener('touchend',    prev.end,    { passive: true });
      card.removeEventListener('touchcancel', prev.cancel, { passive: true });
      card.removeEventListener('click',       prev.click);
    }
  }

  // [CONFIG] Swipe thresholds and limits
  var SNAP_THRESHOLD = 50;

  var startX = 0, startY = 0, curX = 0, dragging = false, lockAxis = null;
  var cachedRW = 76, cachedLW = 76;

  function onStart(e) {
    if (_openSwipe && _openSwipe !== id) closeAllSwipes();
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    curX = 0; dragging = true; lockAxis = null;
    card.classList.remove('settling');
    var rp = wrap.querySelector('.sw-right'), lp = wrap.querySelector('.sw-left');
    cachedRW = rp ? rp.scrollWidth : 76;
    cachedLW = lp ? lp.scrollWidth : 76;
  }
  function onMove(e) {
    if (!dragging) return;
    var dx = e.touches[0].clientX - startX;
    var dy = e.touches[0].clientY - startY;
    if (!lockAxis) {
      if (Math.abs(dx) > Math.abs(dy) + 4) lockAxis = 'x';
      else if (Math.abs(dy) > Math.abs(dx) + 4) lockAxis = 'y';
      else return;
    }
    if (lockAxis === 'y') return;
    e.preventDefault();
    curX = dx;
    var tx = dx < 0 ? Math.max(-cachedRW - 20, dx) : Math.min(cachedLW + 20, dx);
    card.style.transform = 'translateX(' + tx + 'px)';
    wrap.classList.toggle('revealed', Math.abs(tx) > 10);
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    if (lockAxis === 'y') return;
    var rw = cachedRW, lw = cachedLW, dx = curX;
    card.classList.add('settling');
    if (dx < -SNAP_THRESHOLD) {
      card.style.transform = 'translateX(-' + rw + 'px)';
      wrap.classList.add('revealed'); _openSwipe = id;
    } else if (dx > SNAP_THRESHOLD) {
      card.style.transform = 'translateX(' + lw + 'px)';
      wrap.classList.add('revealed'); _openSwipe = id;
    } else {
      card.style.transform = 'translateX(0)';
      wrap.classList.remove('revealed');
      if (_openSwipe === id) _openSwipe = null;
    }
    setTimeout(function() { card.classList.remove('settling'); }, 260);
  }
  function onCancel() {
    if (!dragging) return;
    dragging = false; lockAxis = null; curX = 0;
    card.classList.add('settling');
    card.style.transform = 'translateX(0)';
    wrap.classList.remove('revealed');
    if (_openSwipe === id) _openSwipe = null;
    setTimeout(function() { card.classList.remove('settling'); }, 260);
  }
  function onClick(e) {
    if (_openSwipe === id) { e.stopPropagation(); closeAllSwipes(); }
  }

  card.addEventListener('touchstart',  onStart,  { passive: true });
  card.addEventListener('touchmove',   onMove,   { passive: false });
  card.addEventListener('touchend',    onEnd,    { passive: true });
  card.addEventListener('touchcancel', onCancel, { passive: true });
  card.addEventListener('click',       onClick);

  if (_swipeListeners) {
    _swipeListeners.set(card, { start:onStart, move:onMove, end:onEnd, cancel:onCancel, click:onClick });
  }
}

// [EVENT] Delegated click handler for tx list — delete, edit, archive, open
D.txl.addEventListener('click', function(e) {
  var del    = e.target.closest('[data-del]');

// [EVENT] Unarchive debt with optimistic UI update and rollback
function doUnarchive(id) {
  var idx = S.archivedDebts.findIndex(function(x){ return x.id === id; });
  var snapD = S.debts.slice(), snapA = S.archivedDebts.slice();
  if (idx >= 0) {
    var moved = Object.assign({}, S.archivedDebts[idx], { archived:false });
    S.archivedDebts.splice(idx, 1);
    S.debts.unshift(moved);
  }
  S.filtered = (S.txTab === 'archived' ? S.archivedDebts : S.debts).slice();
  renderTxPage();
  call({ action:'unarchiveDebt', id:id },
    function() {
      showToast('↩️ Transaksi berhasil direstore', 's');
      if (D.archBadge) D.archBadge.textContent = S.archivedDebts.length > 0 ? '('+S.archivedDebts.length+')' : '';
      S._cache.ts = 0;
      if (S.page === 'dashboard') renderDash(S.debts, buildSummary(S.debts.concat(S.archivedDebts)));
      if (S.selId === id) renderDetail(id);
    },
    function(e) {
      showToast('Gagal: ' + e, 'e');
      S.debts = snapD; S.archivedDebts = snapA;
      S.filtered = (S.txTab === 'archived' ? S.archivedDebts : S.debts).slice();
      renderTxPage();
    }
  );
}

// [STATE] Optimistic remove — clear card from DOM and state arrays
function optimisticRemove(id) {
  var swWrap = g('sw-' + id);
  if (swWrap) { swWrap.remove(); }
  else { var txCard = g('tc-' + id); if (txCard) txCard.remove(); }
  var dCard = D.dlist.querySelector('[data-id="' + id + '"]');
  if (dCard) dCard.classList.add('removing');
}

// [STATE] Optimistic update — patch debt in state and filtered list
function optimisticUpdateLocal(debt) {
  var idx = S.debts.findIndex(function(x) { return x.id === debt.id; });
  if (idx >= 0) {
    S.debts[idx] = debt;
  } else {
    var aidx = S.archivedDebts.findIndex(function(x) { return x.id === debt.id; });
    if (aidx >= 0) S.archivedDebts[aidx] = debt;
  }
  var src = S.txTab === 'archived' ? S.archivedDebts : S.debts;
  S.filtered = S.q ? src.filter(function(d) {
    var statusAlias = d.status === 'paid' ? 'lunas' : d.status === 'active' ? 'aktif' : d.status;
    var isOvAlias   = (d.overpayment_amount || 0) > 0 ? 'lebih bayar' : '';
    return (d.person_name || '').toLowerCase().indexOf(S.q) !== -1 ||
           (d.notes       || '').toLowerCase().indexOf(S.q) !== -1 ||
           statusAlias.indexOf(S.q) !== -1 ||
           isOvAlias.indexOf(S.q)   !== -1;
  }) : src.slice();
}

// [STATE] Optimistic add — prepend new debt to state
function optimisticAdd(debt) {
  S.debts.unshift(debt);
  S.filtered = S.q ? S.filtered : S.debts.slice();
}

      h += '<div class="dh-info"><div class="dh-name">' + esc(d.person_name) + '</div>';
      h += '<div class="dh-meta">' + bdg + (isArch ? '<span class="arch-badge" style="margin-left:4px">&#128450;&#65039; Arsip</span>' : '') + (d.due_date ? '<span class="due-chip">Tempo: <span class="' + (od ? 'ov' : 'ok') + '">' + fDt(d.due_date) + '</span></span>' : '') + '</div></div></div>';
      h += '<div class="ring-wrap"><svg class="ring-svg" width="64" height="64" viewBox="0 0 64 64">';
      h += '<circle class="ring-track" cx="32" cy="32" r="27"/>';
      h += '<circle class="ring-fill ' + rCls + '" id="rf-' + esc(id) + '" cx="32" cy="32" r="27" stroke-dashoffset="188.5"/>';
      h += '</svg><div class="ring-pct" id="rp-' + esc(id) + '">0%</div></div>';
      h += '</div>';
      h += '<div style="margin-top:6px"><div style="font-size:11px;color:rgba(241,245,249,.5);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px">Sisa Tagihan</div>';
      h += '<div style="font-family:\'Sora\',sans-serif;font-size:26px;font-weight:700;background:linear-gradient(90deg,#fff 30%,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px">' + fRp(rem) + '</div></div>';
      h += '</div>';
      if (isArch) {
        h += '<div class="det-arch-banner">';
        h += '<div class="det-arch-icon">&#128450;&#65039;</div>';
        h += '<div class="det-arch-body"><div class="det-arch-label">Transaksi Diarsip</div>';
        h += '<div class="det-arch-note">Data tetap aman dan tidak dihitung di dashboard. Klik Restore untuk mengaktifkan kembali.</div></div>';
        h += '<button class="det-arch-btn" id="det-unarch-btn" data-id="' + esc(d.id) + '">Restore</button>';
        h += '</div>';
      }
      if (d.notes) {
        h += '<div class="det-notes"><strong>📝 Keterangan</strong>' + esc(d.notes) + '</div>';
      }
      var ov = +d.overpayment_amount || 0;
      if (ov > 0) {
        h += '<div class="det-ov">';
        h += '<div class="det-ov-label">💰 Kelebihan Bayar</div>';
        h += '<div class="det-ov-amount">' + fRp(ov) + '</div>';
        h += '<div class="det-ov-note">Pembayaran melebihi total pinjaman. Dana ini dapat dikembalikan atau dialihkan.</div>';
        h += '</div>';
      }
      h += '<div class="bkd-grid">';
      h += '<div class="bkd-item bi-po"><div class="bkd-label">🏦 Pokok</div><div class="bkd-val">' + fRp(pr) + '</div><div class="bkd-sub">' + fRp(pPaid) + ' terbayar</div></div>';
      h += '<div class="bkd-item bi-bu"><div class="bkd-label">💹 Bunga</div><div class="bkd-val">' + fRp(ir) + '</div><div class="bkd-sub">' + fRp(iPaid) + ' terbayar</div></div>';
      h += '<div class="bkd-item bi-to"><div class="bkd-label">📋 Total</div><div class="bkd-val" style="color:var(--accent2)">' + fRp(tot) + '</div><div class="bkd-sub">' + p + '% terlunasi</div></div>';
      h += '<div class="bkd-item bi-si"><div class="bkd-label">⏳ Sisa</div><div class="bkd-val" style="color:' + (isPaid ? 'var(--success)' : od ? 'var(--danger)' : 'var(--warn)') + '">' + fRp(rem) + '</div><div class="bkd-sub">' + (isPaid ? 'Selesai ✓' : insts.length + ' pembayaran') + '</div></div>';
      h += '</div>';
      h += '<div class="sb-wrap"><div class="sb-head"><span>Komposisi Pinjaman</span><span>' + fRp(tot) + '</span></div>';
      h += '<div class="sb-bg"><div class="sb-pri" id="sbp-' + esc(id) + '" style="width:0%"></div><div class="sb-int" id="sbi-' + esc(id) + '" style="width:0%"></div></div>';
      h += '<div class="sb-leg"><div class="leg lp">Pokok ' + priPct + '%</div><div class="leg li">Bunga ' + intPct + '%</div></div></div>';
      h += '<div class="mp-wrap"><div class="mp-head"><div class="mp-title">Progress Pelunasan</div>';
      h += '<div class="mp-pct' + (isPaid ? ' done' : '') + '" id="mpc-' + esc(id) + '">0%</div></div>';
      h += '<div class="mp-bg"><div class="mp-track' + (isPaid ? ' done' : '') + '" id="mpt-' + esc(id) + '" style="width:0%"></div></div>';
      h += '<div class="mp-sub"><span>Terbayar: <span style="color:var(--success)">' + fRp(paid) + '</span></span><span>Total: <span>' + fRp(tot) + '</span></span></div></div>';
      if (!isPaid && !isArch) {
        h += '<button class="pay-btn" id="det-pay-btn">💳 Bayar Cicilan</button>';
      } else if (isPaid && !isArch) {
        h += '<div style="background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25);border-radius:var(--rs);padding:14px 16px;margin-bottom:14px;text-align:center">';
        h += '<div style="font-size:24px;margin-bottom:4px">🎉</div><div style="font-family:\'Sora\',sans-serif;font-weight:700;color:var(--success)">Pinjaman Lunas!</div>';
        h += '<div style="font-size:12px;color:var(--muted);margin-top:2px">Semua cicilan telah dibayar</div></div>';
        h += '<button class="arch-action-btn do-archive" id="det-arch-btn" data-id="' + esc(d.id) + '">&#128450;&#65039; Arsipkan Transaksi Ini</button>';
      }
      h += '<div class="section-title"><span>Timeline Pembayaran</span><span class="count-badge">' + insts.length + '</span></div>';
      h += '<div class="tl-wrap">';
      if (!insts.length) {
        h += '<div class="empty" style="padding:28px 20px"><div class="ic" style="font-size:36px">📅</div><p>Belum ada pembayaran.</p></div>';
      } else {
        var sorted = insts.slice().sort(function(a, b) { return new Date(a.payment_date) - new Date(b.payment_date); });
        var runIP = 0;
        for (var ti = 0; ti < sorted.length; ti++) {
          var inst = sorted[ti];
          var amt = +inst.payment_amount || 0, isLast = ti === sorted.length - 1;
          var iAlloc = Math.min(amt, Math.max(0, ir - runIP)), pAlloc = amt - iAlloc;
          runIP += iAlloc;
          var dotCls = (isLast && !isPaid) ? 'tl-dot cur' : 'tl-dot pd';
          var dotIco = (isLast && !isPaid) ? '⏰' : '✅';
          h += '<div class="tl-item"><div class="tl-left"><div class="' + dotCls + '">' + dotIco + '</div>';
          h += '<div class="tl-line' + (isLast ? ' last' : '') + '"></div></div>';
          h += '<div class="tl-body' + (ti === 0 ? ' first' : '') + '">';
          h += '<div class="tl-meta"><div class="tl-title">Pembayaran ke-' + (ti + 1) + '</div><div class="tl-amount">' + fRp(amt) + '</div></div>';
          h += '<div class="tl-date">' + fDt(inst.payment_date) + '</div>';
          h += '<div class="tl-alloc">';
          if (iAlloc > 0) h += '<span class="at at-i">Bunga: ' + fRp(iAlloc) + '</span>';
          if (pAlloc > 0) h += '<span class="at at-p">Pokok: ' + fRp(pAlloc) + '</span>';
          h += '</div></div></div>';
        }
        if (!isPaid) {
          h += '<div class="tl-future"><div class="tl-left"><div class="tl-dot" style="font-size:16px">🔮</div><div class="tl-line last"></div></div>';
          h += '<div class="tl-body" style="padding-top:4px"><div class="tl-title" style="color:var(--muted)">Cicilan Berikutnya</div><div class="tl-date">Sisa ' + fRp(rem) + '</div></div></div>';
        }
      }
      h += '</div></div>';
      el.innerHTML = h;

      requestAnimationFrame(function() {
        if (myGen !== _detailGen) return;

        var rf = g('rf-' + id);
        if (rf) setTimeout(function() {
          if (myGen !== _detailGen) return;
          rf.style.strokeDashoffset = doff;
        }, 200);

        var rp  = g('rp-' + id);
        var mpc = g('mpc-' + id), mpt = g('mpt-' + id);
        if (mpc && mpt) {
          var st = null, dur = 1000;
          setTimeout(function() {
            if (myGen !== _detailGen) return;
            requestAnimationFrame(function tick(ts) {
              if (myGen !== _detailGen) return;
              if (!st) st = ts;
              var e = Math.min(ts - st, dur), ease = 1 - Math.pow(1 - e / dur, 3);
              var cur = Math.round(p * ease);
              mpc.textContent = cur + '%';
              mpt.style.width = cur + '%';
              if (rp) rp.textContent = cur + '%';
              if (e < dur) requestAnimationFrame(tick);
              else {
                mpc.textContent = p + '%';
                mpt.style.width = p + '%';
                if (rp) rp.textContent = p + '%';
              }
            });
          }, 350);
        } else if (rp) {
          rp.textContent = p + '%';
        }
        var sbp = g('sbp-' + id), sbi = g('sbi-' + id);
        if (sbp && sbi) setTimeout(function() {
          if (myGen !== _detailGen) return;
          sbp.style.width = priPct + '%'; sbi.style.width = intPct + '%';
        }, 150);

        var bb = g('det-back');
        if (bb) bb.addEventListener('click', function() { goPage(S.prevPage || 'dashboard'); });
        var _dab = document.getElementById('det-arch-btn');
        if (_dab) _dab.addEventListener('click', function() { handleSwipeArchive(this.dataset.id); });
        var _dub = document.getElementById('det-unarch-btn');
        if (_dub) _dub.addEventListener('click', function() { doUnarchive(this.dataset.id); });
        var _dpb = document.getElementById('det-pay-btn');
        if (_dpb) _dpb.addEventListener('click', function() {
          var fresh = S.debts.find(function(x) { return x.id === id; });
          openPay(id, fresh ? fresh.remaining_amount : rem);
        });
      });
    },
    function(e) {
      if (myGen !== _detailGen) return;
      el.innerHTML = '<div class="error-state"><div class="ic">⚠️</div><p>' + esc(e) + '</p>'
        + '<button class="error-retry" onclick="renderDetail(\'' + esc(id) + '\')">Coba Lagi</button></div>';
    }
  );
}

var _toastTimer;
// [UI] Show toast notification with auto-dismiss
function showToast(msg, type) {
  var t = D.toast;
  t.textContent = msg;
  t.className   = 'toast ' + (type || '');
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3200);
}

// [UX] Sync due date placeholder visibility for add form
(function() {
  var inp = document.getElementById('inp-due');
  var ph  = document.getElementById('due-ph');
  if (!inp || !ph) return;
  function sync() {
    var empty = inp.value === '';
    ph.classList.toggle('hidden', !empty);
    inp.setAttribute('data-empty', empty ? 'true' : 'false');
  }
  inp.addEventListener('change', sync);
  inp.addEventListener('input',  sync);
  sync();
})();

// [UX] Sync due date placeholder visibility for edit form
(function() {
  var inp = document.getElementById('edit-due');
  var ph  = document.getElementById('edit-due-ph');
  if (!inp || !ph) return;
  function sync() {
    var empty = inp.value === '';
    ph.classList.toggle('hidden', !empty);
    inp.setAttribute('data-empty', empty ? 'true' : 'false');
  }
  inp.addEventListener('change', sync);
  inp.addEventListener('input',  sync);
  sync();
})();

initCI(g('inp-prin'));
initCI(g('inp-int'));
initCI(g('inp-pay'), function() {});
g('inp-paydate').value = _todayLocal();
// [UX] Sync paydate placeholder visibility
(function() {
  var inp = document.getElementById('inp-paydate');
  var ph  = document.getElementById('paydate-ph');
  if (!inp || !ph) return;
  function sync() { ph.classList.toggle('hidden', inp.value !== ''); }
  inp.addEventListener('change', sync);
  inp.addEventListener('input',  sync);
  sync();
})();
initPullToRefresh();

// [UX] Offline detection — show/hide banner and update health dot on connection change
(function() {
  var banner = document.getElementById('offline-banner');
  function update() {
    if (!banner) return;
    var offline = !navigator.onLine;
    banner.classList.toggle('show', offline);
    var dot = g('health-dot');
    if (dot && offline) { dot.className = 'health-dot err'; dot.title = 'Tidak ada koneksi internet'; }
  }
  window.addEventListener('online',  update);
  window.addEventListener('offline', update);
  update();
})();

// [API] Run health check on startup
(function runHealthCheck() {
  var dot = g('health-dot');
  if (dot && navigator.onLine !== false) { dot.className = 'health-dot chk'; dot.title = 'Memeriksa koneksi…'; }
  call({ action:'healthCheck' },
    function(r) {
      if (dot) { dot.className = 'health-dot ok'; dot.title = 'Terhubung · ' + (r.spreadsheet || 'OK') + ' · ' + (r.now || ''); }
    },
    function(e) {
      if (dot) { dot.className = 'health-dot err'; dot.title = 'Koneksi bermasalah: ' + (e || 'error'); }
    }
  );
})();

loadDebts();
</script>
